name: Security scan

# OWASP Dependency-Check is deliberately not part of CI. It maintains a local copy of
# the NVD, which makes the first run slow and needs an API key to avoid rate limiting —
# costs that belong on a schedule rather than on every pull request. See the `security`
# profile in pom.xml.
on:
  schedule:
    - cron: '0 3 * * 1'   # 03:00 UTC every Monday
  workflow_dispatch:

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # The NVD database is large and changes slowly; caching it turns a ~15 minute
      # download into seconds on subsequent runs.
      - name: Cache NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      # Register a key at https://nvd.nist.gov/developers/request-an-api-key and add it
      # as the NVD_API_KEY repository secret. Without it the scan still runs, but the
      # NVD heavily rate-limits anonymous requests and it may exceed the timeout.
      - name: Run dependency check
        working-directory: investor-portfolio-hexagonal
        run: >
          mvn --batch-mode --no-transfer-progress verify -Psecurity -DskipTests
          -Dnvd.api.key=${{ secrets.NVD_API_KEY }}

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: investor-portfolio-hexagonal/target/dependency-check-report.*
          retention-days: 90
          if-no-files-found: ignore
