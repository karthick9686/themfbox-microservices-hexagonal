# =========================
# SERVER CONFIG
# =========================
# 8099 keeps this service alongside investor-portfolio-service (8098) for response diffing.
server.port=${SERVER_PORT:8099}
spring.application.name=investor-portfolio-hexagonal

# The only two custom properties any code in this service reads. The former pdfDir / fontDir /
# logoDir / chartDir / thymeleafDir entries pointed at another developer's local checkout of
# investor-portfolio-service, so they broke on every other machine — and nothing read them
# anyway. Removed along with the other inherited-but-unused keys (jwt.secret-key, eureka.*,
# hostDomainUrl, vendor.logo.url, custom.logo.url, amfi.service.base-url).
custom.server.url=${SERVER_BASE_URL:http://localhost:8099}
amc.logo.url=${AMC_LOGO_URL:https://api.advisorkhoj.com/nse/images/amc-logo/}

# =========================
# PRIMARY DATASOURCE
# =========================
# No committed defaults for credentials, in dev either — a password in a dev profile is still
# a password in git. Export them first; see .env.example.
spring.datasource.primary.jdbc-url=${DB_PRIMARY_URL:jdbc:mysql://169.38.132.168:3306/mfportfolio}
spring.datasource.primary.username=${DB_PRIMARY_USERNAME}
spring.datasource.primary.password=${DB_PRIMARY_PASSWORD}
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.primary.hikari.pool-name=PrimaryHikariPool
spring.datasource.primary.hikari.maximum-pool-size=50
spring.datasource.primary.hikari.minimum-idle=10
spring.datasource.primary.hikari.connection-timeout=30000

# =========================
# SECONDARY DATASOURCE
# =========================
spring.datasource.secondary.jdbc-url=${DB_SECONDARY_URL:jdbc:mysql://169.38.132.168:3306/advisorkhoj_amfi}
spring.datasource.secondary.username=${DB_SECONDARY_USERNAME}
spring.datasource.secondary.password=${DB_SECONDARY_PASSWORD}
spring.datasource.secondary.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.secondary.hikari.pool-name=SecondaryHikariPool
spring.datasource.secondary.hikari.maximum-pool-size=50
spring.datasource.secondary.hikari.minimum-idle=10
spring.datasource.secondary.hikari.connection-timeout=60000

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =========================
# SERVER PERFORMANCE
# =========================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html
server.compression.min-response-size=1024

# =========================
# LOGGING (CLEAN & MINIMAL)
# =========================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Disable SQL logs completely
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# =========================
# DEVTOOLS (DISABLED)
# =========================
spring.devtools.restart.enabled=false
spring.devtools.add-properties=false
