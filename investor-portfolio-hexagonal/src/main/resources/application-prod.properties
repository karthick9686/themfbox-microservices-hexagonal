# ==================================================
# APPLICATION
# ==================================================
# Was 8080, which collides with investor-portfolio-service in production — whichever service
# starts second fails to bind. Override with SERVER_PORT at deploy time.
server.port=${SERVER_PORT:8090}
spring.application.name=investor-portfolio-hexagonal

# ==================================================
# URLS
# ==================================================
# custom.server.url and amc.logo.url are the only two custom properties any code in this
# service reads. Everything else that used to live in this file (pdfDir, fontDir, logoDir,
# chartDir, thymeleaf*, pdfUrl, hostDomainUrl, vendor.logo.url, custom.logo.url,
# amfi.service.base-url, jwt.secret-key, eureka.*) was carried over from
# investor-portfolio-service and is not read by anything here. Removed rather than left to
# mislead whoever debugs this next.
custom.server.url=${SERVER_BASE_URL:https://api.advisorkhoj.com/portfolio}
amc.logo.url=${AMC_LOGO_URL:https://api.advisorkhoj.com/nse/images/amc-logo/}

# ==================================================
# PRIMARY DATASOURCE
# ==================================================
# Credentials come from the environment and have no default: the application must fail to
# start rather than fall back to a value committed in git. See .env.example.
spring.datasource.primary.jdbc-url=${DB_PRIMARY_URL:jdbc:mysql://169.38.132.168:3306/mfportfolio?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.primary.username=${DB_PRIMARY_USERNAME}
spring.datasource.primary.password=${DB_PRIMARY_PASSWORD}
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.primary.hikari.pool-name=PrimaryHikariPool
spring.datasource.primary.hikari.maximum-pool-size=100
spring.datasource.primary.hikari.minimum-idle=10
spring.datasource.primary.hikari.connection-timeout=30000

# ==================================================
# SECONDARY DATASOURCE
# ==================================================
spring.datasource.secondary.jdbc-url=${DB_SECONDARY_URL:jdbc:mysql://169.38.132.168:3306/advisorkhoj_amfi?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.secondary.username=${DB_SECONDARY_USERNAME}
spring.datasource.secondary.password=${DB_SECONDARY_PASSWORD}
spring.datasource.secondary.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.secondary.hikari.pool-name=SecondaryHikariPool
spring.datasource.secondary.hikari.maximum-pool-size=100
spring.datasource.secondary.hikari.minimum-idle=10
spring.datasource.secondary.hikari.connection-timeout=60000

# ==================================================
# JPA
# ==================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==================================================
# COMPRESSION
# ==================================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html
server.compression.min-response-size=1024

# ==================================================
# SWAGGER
# ==================================================
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs

# ==================================================
# LOGGING
# ==================================================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF

# ==================================================
# DEVTOOLS
# ==================================================
spring.devtools.restart.enabled=false
spring.devtools.add-properties=false
