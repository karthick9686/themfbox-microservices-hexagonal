#Hexagonal investor-portfolio read model
spring.profiles.active=dev

# Loads a local, gitignored .env if one is present, so credentials can be supplied without
# setting shell variables or IDE run-configuration entries. Optional: real environment
# variables work just as well, and take precedence in deployed environments.
#
# Both locations are listed because the working directory differs by how the app is launched.
# IntelliJ defaults to the repository root (D:\Github\themfbox-microservices-hexagonal), while
# `mvn spring-boot:run` and `java -jar` from the module use the module directory. Listing both
# means .env is found either way instead of the app failing with "Missing required
# configuration" only under the IDE.
spring.config.import=optional:file:./.env[.properties],optional:file:./investor-portfolio-hexagonal/.env[.properties]
